<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Powerful Filler</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-container">
      <div class="title-container">
        <img src="/Logo2.png" alt="Logo" class="logo">
        <div class="header-title">Powerful Filler</div>
      </div>
      <nav class="menu-container">
        <a href="/" class="active">Home</a>
        <a href="/tutorial/google_form">Usage tutorials</a>
        <a href="/privacy">Privacy Policy</a>
        <a href="/about">About</a>
      </nav>
    </div>

  <!-- Hero Section -->
  <section id="hero" class="hero">
    <h1>
      <span class="gradient-text">Save your time !!!</span>
    </h1>
    <p>Fill smarter, fast and automated solution for filling out Google Forms easily. Many features work.
      <br>
      Text input <span class="check">✓</span>  
      Choice <span class="check">✓</span>  
      Checkbox <span class="check">✓</span>  
      Drop-down <span class="check">✓</span>  
      Date&Time <span class="check">✓</span>
      ...,etc

    <!-- Row flex -->
    <div class="hero-row">
      <img src="/gambar1.png" alt="Preview 1" class="hero-img">
      <img src="/gambar2.png" alt="Preview 2" class="hero-img2">
    </div>
    <a href="https://chrome.google.com/webstore/detail/onnndeaaamehgojlligapejaichghljj" target="_blank">
      <button class="hero-btn">Get Extension Here</button>
    </a>
  </section>

  
  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Powerful Google Form Filler</p>
  </footer>

  <script src="/script.js"></script>
